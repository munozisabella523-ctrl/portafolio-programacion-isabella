; Configuración interna de PHP, sin apartado visible en la web.
; Tamaño máximo de cada archivo recibido por PHP; afecta a las subidas de imágenes.
upload_max_filesize=5M
; Tamaño máximo de la petición completa con formulario e imágenes.
post_max_size=48M
; Número máximo de archivos por petición en PHP; la aplicación aplica también sus propios límites.
max_file_uploads=20
